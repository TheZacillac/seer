[workspace]
resolver = "2"
members = ["seer-core", "seer-cli", "seer-py"]

[workspace.lints.clippy]
unwrap_used = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "0.26.0"
edition = "2021"
authors = ["Zac Roach"]
license = "MIT"
repository = "https://github.com/TheZacillac/seer"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# DNS resolution
hickory-resolver = { version = "0.26", features = ["dnssec-ring"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# CLI
rustyline = "14"
colored = "2"
indicatif = "0.18"
comfy-table = "7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.28"

# Python bindings
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# OpenTelemetry
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }

# Utilities
futures = "0.3"
async-trait = "0.1"
once_cell = "1"
regex = "1"
url = "2"
base64 = "0.22"
rand = "0.8"
toml = "0.8"

# IDN support
idna = "1"

# Directory paths
dirs = "5"

# TLS/SSL certificate handling
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-parser = "0.16"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
