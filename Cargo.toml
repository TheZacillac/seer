[workspace]
resolver = "2"
members = ["seer-core", "seer-cli", "seer-py"]

[workspace.lints.clippy]
unwrap_used = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "0.44.3"
edition = "2021"
# Real MSRV, enforced by the `msrv` CI job. The floor comes from rustyline 18
# (uses `File::lock`, stabilized in 1.89). Bump this when a dependency raises
# it; don't lower it below what CI verifies.
rust-version = "1.89"
authors = ["Zac Roach"]
license = "MIT"
repository = "https://github.com/TheZacillac/seer"
homepage = "https://github.com/TheZacillac/seer"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }

# HTTP client
# reqwest 0.13 renamed the TLS feature `rustls-tls` -> `rustls`, and that
# feature now selects aws-lc-rs as the crypto provider where 0.12's
# `rustls-tls` used ring. Both providers therefore sit in the tree (hickory
# still pins ring via dnssec-ring/tls-ring/https-ring), which is fine because
# each configures its own explicitly rather than relying on rustls' ambiguous
# process-level default — verified end-to-end over plain DNS, DoT, DoH, and
# RDAP-over-HTTPS. `aws-lc-sys` does add a cmake/C build step, which matters
# for the cargo-dist cross-compiled release targets.
# `default-features = false` keeps reqwest off its own default-tls path; the
# native-tls in the tree is seer-core's own dependency for SSL chain
# inspection (ssl.rs), unrelated to this.
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }

# DNS resolution.
# tls-ring/https-ring enable DoT/DoH upstream nameservers (tls:// and https://
# specs); webpki-roots supplies the rustls root store hickory verifies those
# TLS connections against (without it the root store would be empty and every
# DoT/DoH handshake would fail). ring + rustls + webpki-roots are already in
# the dependency tree via reqwest's rustls feature and dnssec-ring, so this adds
# no new TLS stack.
hickory-resolver = { version = "0.26", features = ["dnssec-ring", "tls-ring", "https-ring", "webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# CLI
rustyline = "18"
shlex = "2"
colored = "3"
indicatif = "0.18"
comfy-table = "7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
crossterm = "0.29"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# OpenTelemetry
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

# Utilities
futures = "0.3"
async-trait = "0.1"
once_cell = "1"
regex = "1"
url = "2"
base64 = "0.23"
rand = "0.10"
getrandom = "0.4"
toml = "1.1"

# IDN support
idna = "1"

# Test-only: deterministic HTTP mocking and snapshot assertions
wiremock = "0.6"
insta = { version = "1", features = ["filters"] }

# Directory paths
dirs = "6"

# TLS/SSL certificate handling
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-parser = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with.
#
# LTO is OFF here (unlike [profile.release]): thin-LTO intermediate objects
# deterministically trip Windows Defender's realtime scan on GitHub's
# windows-latest runners ("could not write output ... permission denied",
# identical on two consecutive v0.33.0 attempts), killing the build. The
# dev/test profiles never trip it. Different codegen → different bytes →
# no false positive. Costs ~10% binary size on prebuilt artifacts only;
# `cargo install seer-cli` still uses [profile.release] with thin LTO.
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
