[workspace]
resolver = "2"
members = ["seer-core", "seer-cli", "seer-py"]

[workspace.lints.clippy]
unwrap_used = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "0.48.0"
edition = "2021"
# Real MSRV, enforced by the `msrv` CI job. The floor comes from rustyline 18
# (uses `File::lock`, stabilized in 1.89). Bump this when a dependency raises
# it; don't lower it below what CI verifies.
rust-version = "1.89"
authors = ["Zac Roach"]
license = "MIT"
repository = "https://github.com/TheZacillac/seer"
homepage = "https://github.com/TheZacillac/seer"

[workspace.dependencies]
# default-features off so seer-py gets the slim library; seer-cli enables `cli`.
seer-core = { version = "0.48.0", path = "seer-core", default-features = false }

# Async runtime
# `signal` is enabled only by seer-cli (Ctrl-C handling), not the library.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

# HTTP client
# `rustls` selects aws-lc-rs as the crypto provider. hickory (below) is on
# aws-lc-rs too, and ssl.rs/status inspect certificates through tokio-rustls on
# the same provider, so the whole tree carries ONE crypto/TLS stack (no ring,
# no OpenSSL). Every rustls config picks its provider explicitly rather than
# relying on rustls' process-level default. aws-lc-sys builds with the `cc`
# crate (no cmake/NASM needed on the dist targets).
# `default-features = false` keeps reqwest off its own default-tls path;
# `stream` backs the capped `bytes_stream()` body readers.
reqwest = { version = "0.13", features = ["rustls", "stream"], default-features = false }

# DNS resolution.
# `tokio` is the runtime glue (the only default feature we keep —
# `system-config` is unused because every resolver is built from an explicit
# config). tls/https enable DoT/DoH upstream nameservers (tls:// and https://
# specs); webpki-roots supplies the bundled root store hickory verifies those
# connections against, so DNS never depends on a host CA bundle.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "dnssec-aws-lc-rs", "tls-aws-lc-rs", "https-aws-lc-rs", "webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
# No chrono::Local anywhere, so the clock/iana-time-zone defaults are dropped.
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }

# CLI
# Only file history is used — no custom key bindings or filename completion.
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
shlex = "2"
colored = "3"
indicatif = "0.18"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
crossterm = "0.29"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# OpenTelemetry
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

# Utilities
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# No pattern uses \p{..} classes; unicode-perl/unicode-case keep \s\d\w\b and
# (?i) Unicode-aware (e.g. accented AFNIC labels).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
url = "2"
base64 = "0.23"
rand = "0.10"
getrandom = "0.4"
toml = "1.1"

# IDN support
idna = "1"

# Public Suffix List (registrable-domain detection for confusables and
# availability). The list is compiled into the crate, so no runtime fetch.
psl = "2"

# Test-only: deterministic HTTP mocking and snapshot assertions
wiremock = "0.6"
insta = { version = "1", features = ["filters"] }

# TLS/SSL certificate handling. rustls/tokio-rustls are already in the tree via
# reqwest and hickory; seer-core's inspection handshake (tls.rs) uses them
# directly on the same aws-lc-rs provider.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
x509-parser = "0.18"

[profile.release]
# Size-optimized: seer is network-bound, so "s" costs nothing noticeable
# (-24% binary) and fat LTO trims a further ~10%. Unwinding stays on here —
# maturin builds seer-py with this profile and PyO3 relies on catch_unwind.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# The profile that 'dist' will build with (CLI release artifacts only).
#
# LTO is OFF here (unlike [profile.release]): LTO intermediate objects
# deterministically trip Windows Defender's realtime scan on GitHub's
# windows-latest runners ("could not write output ... permission denied",
# identical on two consecutive v0.33.0 attempts), killing the build. The
# dev/test profiles never trip it. Different codegen → different bytes →
# no false positive. `cargo install seer-cli` still uses [profile.release].
# panic = "abort" is safe only here: this profile never builds seer-py.
[profile.dist]
inherits = "release"
lto = false
codegen-units = 16
panic = "abort"
