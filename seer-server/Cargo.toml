[package]
name = "seer-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP server for Seer domain name utilities"
# Not on crates.io and not shipped by cargo-dist yet. [profile.dist] sets
# panic = "abort", under which one panicking request would end the process;
# `cargo install --path seer-server` uses [profile.release], which unwinds.
publish = false

[package.metadata.dist]
dist = false

[dependencies]
seer-core = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true }
governor = { workspace = true }
ipnet = { workspace = true }
# The accept loop is built on hyper directly: `axum::serve` offers no
# header timeout or connection limit. Both crates are already in the tree
# under axum.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server-graceful", "service", "tokio"] }
tower = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
