[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seer-api"
version = "0.45.1"
description = "FastAPI server and MCP integration for Seer domain utilities"
readme = "README.md"
license = { text = "MIT" }
# Floor is 3.10: the mcp SDK requires >=3.10, so a 3.9 install would fail
# at pip resolution. seer_api code also uses 3.10-only syntax (X | Y unions,
# match statements).
requires-python = ">=3.10"
dependencies = [
    # Exclude 0.136.3 (PyPI advisory MAL-2026-4750): that release adds an
    # undocumented `fastar` dep to the `[standard]` extra group, a
    # typosquat-shaped name whose maintainer would gain install-time code
    # execution. We don't install `fastapi[standard]`, but excluding the
    # bad version defensively keeps any future user-driven resolution
    # safe.
    "fastapi>=0.109,!=0.136.3",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    # Floored at 2.0: the server registers handlers through the 2.x API
    # (`add_request_handler` by protocol method name). SDK 1.x has no such
    # method — it used the `@server.list_tools()` / `@server.call_tool()`
    # decorators 2.0 removed — so a 1.x resolution fails at import.
    "mcp>=2.0",
    # The seer Python bindings; distributed on PyPI as `domain-seer`
    # (import name remains `seer`).
    #
    # Floor tracks the oldest bindings release exposing every symbol the
    # routers and MCP server call. 0.44 is required for `delegation` and
    # `all_tlds` (added in v0.44.0) and `record_types` (v0.45.0) — a lower
    # resolution installs cleanly and then AttributeErrors at request time,
    # so bump this whenever a new binding is called.
    "domain-seer>=0.45.0",
    "slowapi>=0.1.9",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.26",
]

[project.scripts]
seer-api = "seer_api.main:run"
seer-mcp = "seer_api.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["seer_api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "RUF002",  # docstrings deliberately use typographic characters ("x" would misread "progress × N")
]

[tool.ruff.lint.isort]
known-first-party = ["seer_api", "seer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
