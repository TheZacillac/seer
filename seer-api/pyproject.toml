[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seer-api"
version = "0.37.0"
description = "FastAPI server and MCP integration for Seer domain utilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # Exclude 0.136.3 (PyPI advisory MAL-2026-4750): that release adds an
    # undocumented `fastar` dep to the `[standard]` extra group, a
    # typosquat-shaped name whose maintainer would gain install-time code
    # execution. We don't install `fastapi[standard]`, but excluding the
    # bad version defensively keeps any future user-driven resolution
    # safe.
    "fastapi>=0.109,!=0.136.3",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "mcp>=1.0",
    # The seer Python bindings; distributed on PyPI as `domain-seer`
    # (import name remains `seer`).
    "domain-seer>=0.32",
    "slowapi>=0.1.9",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.26",
]

[project.scripts]
seer-api = "seer_api.main:run"
seer-mcp = "seer_api.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["seer_api"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["seer_api", "seer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
