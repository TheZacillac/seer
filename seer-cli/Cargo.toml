[package]
name = "seer-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Interactive CLI for Seer domain name utilities"
readme = "../README.md"
keywords = ["whois", "rdap", "dns", "domain", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "seer"
path = "src/main.rs"

# cargo-dist: name the Homebrew formula after the binary (`seer`) rather than
# the crate (`seer-cli`), so the install is `brew install TheZacillac/tap/seer`.
[package.metadata.dist]
formula = "seer"

[dependencies]
seer-core = { version = "0.47.0", path = "../seer-core" }
tokio = { workspace = true }
rustyline = { workspace = true }
shlex = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
ratatui = "0.30"
futures = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
getrandom = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
chrono = { workspace = true }
