# Dependabot keeps dependencies fresh and surfaces security advisories early.
# One update config per dependency manifest in the repo. Minor/patch bumps are
# grouped into a single PR per ecosystem to cut review noise; major bumps still
# open individually so breaking changes get scrutinized on their own.
#
# The CI `audit` job (rustsec/audit-check) is the safety net for the Rust side —
# prefer keeping these green so advisories don't pile up.
version: 2
updates:
  # Rust workspace: seer-core, seer-cli, and the seer-py crate (resolved via the
  # root Cargo.lock — the cargo ecosystem at "/" covers all workspace members).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix(deps)"
    groups:
      # The OpenTelemetry crates release in lockstep and pin compatible versions
      # of each other — bump them as ONE PR (any update-type) so a partial 0.x
      # bump can't leave `--features otel` unbuildable. Listed first so it wins
      # over the catch-all below.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions pinned in ci.yml / publish.yml.
  #
  # CAVEAT — `release.yml` is GENERATED by cargo-dist (`dist generate`) and must
  # not be hand-edited. Dependabot can't be scoped to skip a single workflow
  # file, so it will occasionally open a github-actions PR that also touches
  # release.yml; that breaks cargo-dist's `plan` job. Close such PRs and refresh
  # release.yml's actions via a cargo-dist update instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain@<ver>` overloads the action ref to mean the Rust
      # TOOLCHAIN (e.g. `@1.88.0` is the MSRV pin, `@stable` is stable), not the
      # action's own version. Dependabot misreads it and would "bump" the pin to
      # a newer Rust tag, silently changing what the MSRV job verifies. Pin Rust
      # versions by editing the ref directly.
      - dependency-name: "dtolnay/rust-toolchain"

  # seer-api (FastAPI + MCP): PEP 621 pyproject.toml managed with pip/hatchling.
  - package-ecosystem: "pip"
    directory: "/seer-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix(deps)"
    groups:
      seer-api-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # seer-py (PyO3 bindings): uv-managed dev environment (uv.lock).
  - package-ecosystem: "uv"
    directory: "/seer-py"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    groups:
      seer-py-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
