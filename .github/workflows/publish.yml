name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  # Force the sparse index — the legacy git index can lag the sparse index
  # by 10+ minutes after a publish, which is what was tripping up the
  # `seer-cli` step.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read workspace version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Publish seer-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish -p seer-core
        continue-on-error: true  # Skip if already published

      # Replace the fixed 60s sleep with an explicit poll against the sparse
      # index for our exact version. Up to ~10 min, then fail loudly.
      - name: Wait until crates.io has seer-core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf "https://index.crates.io/se/er/seer-core" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "seer-core ${VERSION} visible in sparse index after ${i} attempts"
              # Drop any cached registry data so the next cargo invocation
              # re-fetches and definitely sees the new version.
              rm -rf "$HOME/.cargo/registry/index"
              exit 0
            fi
            echo "Attempt ${i}: seer-core ${VERSION} not yet indexed; sleeping 10s"
            sleep 10
          done
          echo "Timed out waiting for seer-core ${VERSION} to appear in the sparse index"
          exit 1

      - name: Publish seer-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish -p seer-cli

  # Build seer-py wheels (PyPI distribution: `domain-seer`; import name stays
  # `seer`). abi3-py39 → one wheel per platform covers Python 3.9+. Wheels are
  # both attached to the GitHub release AND published to PyPI below.
  wheels:
    name: domain-seer wheels (${{ matrix.os }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: seer-py
          command: build
          args: --release
      - name: Upload wheels to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" target/wheels/*.whl --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  sdist:
    name: domain-seer sdist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: seer-py
          command: sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # Publishes via PyPI Trusted Publishing (OIDC) — no API token secret.
  # One-time PyPI-side setup: add a publisher for project `domain-seer`
  # (owner TheZacillac, repo seer, workflow publish.yml, environment pypi).
  publish-pypi:
    name: Publish domain-seer to PyPI
    if: github.event_name == 'release'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
