name: Publish to crates.io

# NOTE: PyPI publishing for the Python bindings (`domain-seer`) is deferred
# (tracked for later). The `wheels` / `sdist` / `publish-pypi` jobs were removed
# from this workflow; see git history for the previous implementation. To
# re-enable: restore those jobs (maturin build → upload artifacts →
# pypa/gh-action-pypi-publish via PyPI Trusted Publishing/OIDC, environment
# `pypi`) and complete the one-time PyPI publisher setup for `domain-seer`.

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  # Force the sparse index — the legacy git index can lag the sparse index
  # by 10+ minutes after a publish, which is what was tripping up the
  # `seer-cli` step.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read workspace version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # Manual dispatches (the normal path — dist-created releases never fire
      # the `published` event, see CLAUDE.md) check out main HEAD, not the
      # release tag. Refuse to publish when the version in Cargo.toml has no
      # tag, or when HEAD isn't the tagged commit — either would put a
      # crates.io release on different code than the GitHub release binaries.
      - name: Verify version matches its release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --quiet origin
          TAG="v${VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "::error::Tag ${TAG} does not exist — tag the release before dispatching publish."
            exit 1
          fi
          if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::HEAD is not the commit tagged ${TAG} — refusing to publish diverging code."
            exit 1
          fi
          echo "HEAD matches ${TAG}; publishing."

      - name: Publish seer-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish -p seer-core
        continue-on-error: true  # Skip if already published

      # Replace the fixed 60s sleep with an explicit poll against the sparse
      # index for our exact version. Up to ~10 min, then fail loudly.
      - name: Wait until crates.io has seer-core
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf "https://index.crates.io/se/er/seer-core" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "seer-core ${VERSION} visible in sparse index after ${i} attempts"
              # Drop any cached registry data so the next cargo invocation
              # re-fetches and definitely sees the new version.
              rm -rf "$HOME/.cargo/registry/index"
              exit 0
            fi
            echo "Attempt ${i}: seer-core ${VERSION} not yet indexed; sleeping 10s"
            sleep 10
          done
          echo "Timed out waiting for seer-core ${VERSION} to appear in the sparse index"
          exit 1

      - name: Publish seer-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_KEY }}
        run: cargo publish -p seer-cli
