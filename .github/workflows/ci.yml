name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same ref (PR force-pushes, rapid re-pushes)
# instead of burning runners on stale commits. Pushes to main are never
# cancelled so its history keeps a complete run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables keep file:line in backtraces but skip full DWARF: ~15% less
  # test-build CPU and a ~40% smaller target/ (local debug builds unaffected).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy type-checks everything `cargo check --workspace` would, so there
      # is no separate check job. --all-targets lints tests/benches too
      # (clippy.toml allows unwrap in tests, so this stays signal-rich rather
      # than noisy).
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The `otel` feature is optional and off by default, so the line above
      # never compiles it. Lint it explicitly so the OpenTelemetry integration
      # (and its dependency bumps) can't silently break.
      - name: Clippy (otel feature)
        run: cargo clippy -p seer-core --features otel --all-targets -- -D warnings
      # seer-py depends on seer-core without the default `cli` feature, so lint
      # that slim build too — otherwise the feature gate could silently rot.
      - name: Clippy (seer-core without the cli feature)
        run: cargo clippy -p seer-core --no-default-features --all-targets -- -D warnings
      # docs.rs renders seer-core's public API docs, and rustdoc lints (broken
      # or private intra-doc links, stray HTML) only warn by default. Deny them
      # with and without `cli`, since that feature gates whole public modules.
      - name: Rustdoc (seer-core)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p seer-core --no-deps
      - name: Rustdoc (seer-core without the cli feature)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p seer-core --no-deps --no-default-features
      # The public builds never render private items' docs, so a broken link
      # there passes both steps above. Gate the contributor view as well.
      - name: Rustdoc (seer-core private items)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p seer-core --no-deps --document-private-items

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python:
    name: Python (seer-py + seer-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Lint before the (slow) maturin build so style failures surface fast.
      # Both packages configure ruff in their own pyproject.toml; ruff's
      # per-file config discovery applies the right one to each tree.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check seer-py/python seer-py/tests seer-api
      # Dev profile: the release profile's fat LTO + codegen-units=1 roughly
      # triples this build, and the pytest suite doesn't need optimized code.
      # Published wheels are still built with the release profile.
      - name: Build and install seer-py (PEP 517 via maturin)
        env:
          MATURIN_PEP517_ARGS: --profile dev
        run: pip install './seer-py[dev]'
      - name: Install seer-api
        run: pip install -e './seer-api[dev]'
      - name: Test seer-py
        run: python -m pytest seer-py/tests -q
      - name: Test seer-api
        run: python -m pytest seer-api/tests -q

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # Verify the workspace compiles on the declared MSRV against the committed
      # Cargo.lock (no re-resolution). If a dependency bump raises the floor this
      # fails — bump `rust-version` in Cargo.toml and the README/CLAUDE.md refs.
      - run: cargo check --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Run the hermetic test suite once under instrumentation, then render
      # report formats from the same profile data (no re-run). Informational
      # only — this job does not gate merges on a coverage threshold.
      - name: Collect coverage
        run: cargo llvm-cov --workspace --no-report
      - name: Print summary
        run: cargo llvm-cov report --summary-only
      - name: Generate HTML report
        run: cargo llvm-cov report --html
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html/
          if-no-files-found: error

  deny:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Gates the dependency tree against deny.toml: RUSTSEC advisories
      # (vulnerable, unsound and unmaintained are all errors, across every
      # feature), the explicit license allow-list, wildcard/duplicate version
      # bans, and crates.io-only sources. This is the only advisory gate:
      # cargo-audit reads the same RustSec DB with weaker defaults (it only
      # warns on unsound/unmaintained), so a separate audit job adds nothing.
      - uses: EmbarkStudios/cargo-deny-action@v2
