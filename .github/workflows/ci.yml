name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # The `otel` feature is optional and off by default, so the line above
      # never compiles it. Check it explicitly so the OpenTelemetry integration
      # (and its dependency bumps) can't silently break.
      - name: Check optional features (otel)
        run: cargo check -p seer-core --features otel

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  python:
    name: Python (seer-py + seer-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install seer-py (PEP 517 via maturin)
        run: pip install './seer-py[dev]'
      - name: Install seer-api
        run: pip install -e './seer-api[dev]'
      - name: Test seer-py
        run: python -m pytest seer-py/tests -q
      - name: Test seer-api
        run: python -m pytest seer-api/tests -q

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # Verify the workspace compiles on the declared MSRV against the committed
      # Cargo.lock (no re-resolution). If a dependency bump raises the floor this
      # fails — bump `rust-version` in Cargo.toml and the README/CLAUDE.md refs.
      - run: cargo check --workspace --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Run the hermetic test suite once under instrumentation, then render
      # report formats from the same profile data (no re-run). Informational
      # only — this job does not gate merges on a coverage threshold.
      - name: Collect coverage
        run: cargo llvm-cov --workspace --no-report
      - name: Print summary
        run: cargo llvm-cov report --summary-only
      - name: Generate HTML + lcov reports
        run: |
          cargo llvm-cov report --html
          cargo llvm-cov report --lcov --output-path lcov.info
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html/
          if-no-files-found: error

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports by creating a check-run, which needs
    # `checks: write`. On `pull_request` the default token grants it, but on
    # `push` to main it does not — without this block the job fails with
    # "Resource not accessible by integration" on every merge.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
