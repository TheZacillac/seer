[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI ("seer" is taken there); the import name is
# still `seer` — set by [tool.maturin] python-source/module-name below.
name = "domain-seer"
version = "0.44.3"
description = "Domain name helper - WHOIS, RDAP, DIG, and propagation checking"
readme = "README.md"
license = { text = "MIT" }
# Floor is 3.10: seer-api (and its mcp SDK dependency) requires >=3.10, so
# advertising 3.9 here would fail at pip resolution time. The pyo3
# abi3-py39 feature flag below stays — abi3 wheels built for 3.9 remain
# forward-compatible with every newer CPython.
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
python-source = "python"
module-name = "seer._seer"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["seer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
