[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
installers = ["shell", "powershell", "homebrew"]
# Homebrew tap to publish the formula to. The `publish-homebrew-formula` job in
# release.yml pushes `Formula/seer.rb` here on each tagged release, using the
# `HOMEBREW_TAP_TOKEN` repo secret (a PAT with cross-repo write access —
# GITHUB_TOKEN cannot push cross-repo). Install: `brew install TheZacillac/tap/seer`.
tap = "TheZacillac/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Override the GitHub Action refs dist bakes into `release.yml`. dist 0.32.0
# still defaults `actions/checkout` to `v6`, while every hand-written workflow
# (ci.yml, publish.yml) is on `v7` — so Dependabot repeatedly opened a
# github-actions PR bumping release.yml, which then failed the `plan` job
# because release.yml is generated and `dist plan` rejects a hand-edited copy.
# Pinning the ref here is the supported way to move it: edit this table, then
# run `dist generate` to regenerate release.yml. Values are substituted verbatim
# after the `@`, so a tag (`v7`) or a commit SHA both work.
[dist.github-action-commits]
"actions/checkout" = "v7"
